<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>モンスターズ・リベンジ</title>
    <style>
        body { text-align: center; background-color: #1a1a1a; color: #ffffff; font-family: sans-serif; touch-action: manipulation; margin: 0; padding: 10px; }
        h1 { color: #ffcc00; font-size: 22px; margin: 10px 0; }
        canvas { border: 4px solid #fff; background: #333; width: 100%; max-width: 800px; height: 350px; display: block; margin: 0 auto; }
        .screen { display: none; }
        .screen.active { display: block; }
        button { font-size: 16px; padding: 10px 18px; cursor: pointer; background-color: #ffcc00; border: none; border-radius: 8px; font-weight: bold; margin: 6px; }
        .unit-btn { width: 70px; height: 75px; font-size: 13px; background-color: #333; color: white; border: 2px solid #555; border-radius: 8px; padding: 2px; line-height: 1.3; vertical-align: top; transition: 0.1s; }
        .unit-btn.cd { border: 4px solid #ff0000 !important; color: #ff0000 !important; font-weight: bold; }
        .stage-btn { font-size: 16px; padding: 12px 20px; margin: 8px; background-color: #ff5722; color: white; }
        .up-btn { background-color: #4CAF50; color: white; padding: 6px 12px; font-size: 13px; }
        .evolve-btn { background-color: #9c27b0; color: white; padding: 6px 12px; font-size: 13px; }
        .panel { background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; display: inline-block; margin: 5px; width: 95%; max-width: 500px; }
        .inventory-panel { background: rgba(255, 255, 255, 0.08); padding: 8px; border-radius: 8px; display: inline-block; margin: 8px auto; width: 95%; max-width: 480px; text-align: left; font-size: 14px; }
    </style>
</head>
<body>
    <h1>モンスターズ・リベンジ</h1>
    
    <!-- マップ画面 -->
    <div id="stageSelectScreen" class="screen active">
        <div class="panel">
            <h2>🗺️ マップ画面</h2>
            <p style="font-size: 18px;">所持XP: <span id="totalXp" style="color: #ffcc00; font-weight: bold;">0</span> XP</p>
            <button onclick="openPowerUpScreen()" style="background-color: #2196F3; color: white;">💪 パワーアップ画面</button>
        </div>
        
        <!-- 素材インベントリ -->
        <div class="inventory-panel">
            <div style="font-weight: bold; color: #ffcc00; margin-bottom: 4px;">🎒 素材インベントリ</div>
            <div>⚔️ 攻撃力の心得: <span id="inv-atk">0</span>個</div>
            <div>🛡️ 体力の心得: <span id="inv-hp">0</span>個</div>
            <div>🐦 速度の心得: <span id="inv-spd">0</span>個</div>
        </div>

        <hr style="width: 80%; border-color: #444; margin: 15px auto;">
        <h3>ステージを選んでね</h3>
        <div id="stageButtonsContainer"></div>
        <br>
        <button onclick="unlockAllStages()" style="background-color: #607D8B; color: white; font-size: 11px; padding: 6px 10px;">【デバッグ】全ステージ解放</button>
        <button onclick="resetSaveData()" style="background-color: #d9534f; color: white; font-size: 11px; padding: 6px 10px;">セーブ初期化</button>
    </div>

    <!-- パワーアップ画面 -->
    <div id="powerUpScreen" class="screen">
        <div class="panel">
            <h2>⚡ パワーアップ (Lv1 ~ 10)</h2>
            <p style="font-size: 18px;">所持XP: <span id="totalXpUp" style="color: #ffcc00; font-weight: bold;">0</span> XP</p>
        </div>
        <div id="powerUpList"></div>
        <br>
        <button onclick="closePowerUpScreen()" style="background-color: #666; color: white;">◀ マップに戻る</button>
    </div>

    <!-- バトル画面 -->
    <div id="battleScreen" class="screen">
        <h2 id="stageTitle" style="font-size: 18px; margin: 5px;">ステージ 1</h2>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <p style="font-size: 18px; font-weight: bold; margin: 8px 0;">所持金: <span id="money" style="color: #ffcc00;">0</span>円</p>
        <div id="unitButtons"></div>
        <br>
        <button onclick="returnToMap()" style="background-color: #d9534f; color: white; font-size: 14px; padding: 8px 15px;">🚪 撤退してマップに戻る</button>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === "spawn") {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === "boss") {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.setValueAtTime(100, now + 0.15);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === "defeat") {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                gainNode.gain.setValueAtTime(0.15, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }

        // 背景画像の読み込み設定
        const bgImages = {
            "朝の森": new Image(),
            "夕方の森": new Image(),
            "夜の森": new Image(),
            "ビーチ": new Image()
        };
        bgImages["朝の森"].src = "IMG_2435.jpeg";
        bgImages["夕方の森"].src = "IMG_2436.jpeg";
        bgImages["夜の森"].src = "IMG_2437.jpeg";
        bgImages["ビーチ"].src = "IMG_2439.jpeg";

        function getBgImageByStage(stage) {
            if (stage <= 2) return bgImages["朝の森"];
            if (stage <= 4) return bgImages["夕方の森"];
            if (stage === 5) return bgImages["夜の森"];
            return bgImages["ビーチ"];
        }

        const SAVE_KEY = "monsterGameSave_v1";
        let saveData = JSON.parse(localStorage.getItem(SAVE_KEY)) || { 
            maxUnlockedStage: 1, 
            xp: 0, 
            levels: [1, 1, 1, 1, 1, 1], 
            unlockedUnits: [true, true, true, false, true, true],
            evolved: [false, false, false, false, false, false],
            materials: { atk: 0, hp: 0, spd: 0 }
        };
        
        function checkSaveDataIntegrity() { 
            if (!saveData.levels || saveData.levels.length < 6) saveData.levels = [1, 1, 1, 1, 1, 1]; 
            if (!saveData.unlockedUnits || saveData.unlockedUnits.length < 6) saveData.unlockedUnits = [true, true, true, false, true, true]; 
            if (!saveData.evolved) saveData.evolved = [false, false, false, false, false, false];
            if (!saveData.materials) saveData.materials = { atk: 0, hp: 0, spd: 0 };
        }
        checkSaveDataIntegrity();
        
        function saveGame() { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); }
        function unlockAllStages() { saveData.maxUnlockedStage = 7; saveData.unlockedUnits = [true, true, true, true, true, true]; saveGame(); initStageSelect(); }
        function resetSaveData() { if (confirm("セーブデータを初期化しますか？")) { localStorage.removeItem(SAVE_KEY); saveData = { maxUnlockedStage: 1, xp: 0, levels: [1, 1, 1, 1, 1, 1], unlockedUnits: [true, true, true, false, true, true], evolved: [false, false, false, false, false, false], materials: { atk: 0, hp: 0, spd: 0 } }; initStageSelect(); } }

        const monsters = [
            { 
                name: "スライム", evolveName: "スクイーズ", icon: "🟢", evolveIcon: "🔵", cost: 50, cd: 1.5, baseHp: 80, speed: 2.0, range: 40, baseAtk: 8, area: false, skill: null,
                hasEvolve: true, evolveCostXp: 10000, evolveReq: { hp: 5 }
            },
            { 
                name: "ゾンビ", evolveName: "ボス・ゾンビ", icon: "🧟", evolveIcon: "🧟‍♂️", cost: 120, cd: 3.0, baseHp: 350, speed: 0.8, range: 40, baseAtk: 12, area: false, skill: null,
                hasEvolve: true, evolveCostXp: 10000, evolveReq: { spd: 2, hp: 3 }
            },
            { 
                name: "ボマー", evolveName: "ヌクレアスボマー", icon: "💣", evolveIcon: "💥", cost: 200, cd: 6.0, baseHp: 40, speed: 3.0, range: 60, baseAtk: 150, area: true, skill: null,
                hasEvolve: true, evolveCostXp: 10000, evolveReq: { atk: 10 }
            },
            { 
                name: "タンクムーン", evolveName: "シャールサン", icon: "🌝", evolveIcon: "🌕", cost: 300, cd: 4.0, baseHp: 700, speed: 0.4, range: 40, baseAtk: 1, area: false, skill: { name: "高速敵ダメージ軽減", desc: "移動速度2.0以上の敵からのダメージを40%軽減" },
                hasEvolve: true, evolveCostXp: 100000, evolveReq: { hp: 20 }
            },
            { 
                name: "スズメバチ", evolveName: "オオスズメバチ", icon: "🐝", evolveIcon: "🐝", cost: 500, cd: 5.0, baseHp: 100, speed: 3.0, range: 150, baseAtk: 30, area: true, skill: { name: "飛び道具無効", desc: "弓使いなどの遠距離攻撃を完全に無効化する" },
                hasEvolve: true, evolveCostXp: 100000, evolveReq: { spd: 20 }
            },
            { 
                name: "ドラゴン", evolveName: "ヒドラゴラゴン", icon: "🐉", evolveIcon: "🐲", cost: 3000, cd: 25.0, baseHp: 500, speed: 1.2, range: 250, baseAtk: 50, area: true, skill: null,
                hasEvolve: true, evolveCostXp: 350000, evolveReq: { hp: 20, atk: 20, spd: 20 }
            }
        ];
        
        const enemyTemplates = {
            "戦士": { name: "戦士", icon: "⚔️", hp: 120, speed: 1.0, range: 40, atk: 10, isProjectile: false, drop: "atk", dropRate: 0.03, area: false },
            "弓使い": { name: "弓使い", icon: "🏹", hp: 70, speed: 1.1, range: 200, atk: 8, isProjectile: true, drop: null, dropRate: 0, area: false },
            "守護騎士": { name: "守護騎士", icon: "🛡️", hp: 400, speed: 0.4, range: 40, atk: 15, isProjectile: false, drop: "hp", dropRate: 0.03, area: false },
            "ハト助": { name: "ハト助", icon: "🐦", hp: 500, speed: 2.0, range: 60, atk: 24, isProjectile: false, drop: "spd", dropRate: 0.03, area: false },
            "フクロウ教授": { name: "フクロウ教授", icon: "🦉", hp: 3000, speed: 0.6, range: 40, atk: 30, isProjectile: false, isBoss: true, drop: null, dropRate: 0, area: false },
            "メェーラム敵": { name: "メェーラム", icon: "🐑", hp: 999999, speed: 2.5, range: 50, atk: 999999, isProjectile: false, isBoss: true, drop: null, dropRate: 0, area: true }
        };

        let money = 150, playerCastleHP = 1000, maxPlayerCastleHP = 1000, enemyCastleHP = 1000, maxEnemyCastleHP = 1000;
        let gameRunning = false, activeMonsters = [], activeHeroes = [], projectiles = [], effects = [], currentStage = 1, gameLoopId = null, gameTimer = 0, stageTimerInterval = null, coolDowns = [0, 0, 0, 0, 0, 0];

        setInterval(() => {
            if (!gameRunning) return;
            monsters.forEach((m, i) => {
                if (!saveData.unlockedUnits[i]) return;
                let btn = document.getElementById("btn-" + i);
                if (!btn) return;
                let currentIcon = saveData.evolved[i] ? m.evolveIcon : m.icon;
                if (coolDowns[i] > 0) { 
                    coolDowns[i] = Math.max(0, coolDowns[i] - 0.1); 
                    btn.classList.add("cd"); 
                    btn.innerHTML = `<span style="font-size:18px;">${currentIcon}</span><br><span style="font-size:11px; font-weight:bold;">${Math.ceil(coolDowns[i])}秒</span>`; 
                } else if (btn.classList.contains("cd")) { 
                    btn.classList.remove("cd"); 
                    updateUnitBtnDisplay(i, btn); 
                }
            });
        }, 100);

        function updateUnitBtnDisplay(i, btn) { 
            checkSaveDataIntegrity(); 
            let m = monsters[i]; 
            let lvl = saveData.levels[i] || 1; 
            let currentIcon = saveData.evolved[i] ? m.evolveIcon : m.icon;
            btn.innerHTML = `<span style="font-size:18px;">${currentIcon}</span><br><span style="font-size:10px;">${saveData.evolved[i] ? '進化済' : 'Lv'+lvl}</span><br><span style="font-size:9px; color:#ffcc00;">${m.cost}円</span>`; 
        }

        function initStageSelect() { 
            document.getElementById("totalXp").innerText = saveData.xp; 
            document.getElementById("inv-atk").innerText = saveData.materials.atk;
            document.getElementById("inv-hp").innerText = saveData.materials.hp;
            document.getElementById("inv-spd").innerText = saveData.materials.spd;

            const container = document.getElementById("stageButtonsContainer"); 
            container.innerHTML = ""; 
            for(let i = 1; i <= 7; i++) { 
                let b = document.createElement("button"); 
                b.className = "stage-btn"; 
                b.innerText = i <= saveData.maxUnlockedStage ? `ステージ ${i} (${i * 200}XP)` : `ステージ ${i} 🔒`; 
                b.disabled = i > saveData.maxUnlockedStage; 
                b.onclick = () => startBattle(i); 
                container.appendChild(b); 
            } 
        }

        function openPowerUpScreen() { 
            checkSaveDataIntegrity(); 
            document.getElementById("stageSelectScreen").classList.remove("active"); 
            document.getElementById("powerUpScreen").classList.add("active"); 
            document.getElementById("totalXpUp").innerText = saveData.xp; 
            const list = document.getElementById("powerUpList"); 
            list.innerHTML = ""; 
            
            monsters.forEach((m, i) => { 
                let isUnlocked = saveData.unlockedUnits[i];
                let lvl = saveData.levels[i] || 1; 
                let isEvolved = saveData.evolved[i];
                let div = document.createElement("div"); 
                div.style.cssText = "background: rgba(255,255,255,0.05); padding: 10px; margin: 6px auto; max-width: 400px; border-radius: 8px; text-align: left;"; 
                
                let skillHtml = "";
                if (m.skill) {
                    skillHtml = `<div style="font-size: 12px; color: #ffcc00; margin-top: 4px;">✨スキル: ${m.skill.name} - ${m.skill.desc}</div>`;
                }

                let currentName = isEvolved ? m.evolveName : m.name;
                let currentIcon = isEvolved ? m.evolveIcon : m.icon;

                if (!isUnlocked) {
                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size:15px; font-weight: bold; color: #888;">🔒 ${m.icon} ${m.name} (未解放)</span>
                            <button class="up-btn" style="background-color: #ff9800;" onclick="unlockUnit(${i})">解放(3000XP)</button>
                        </div>
                        ${skillHtml}
                    `;
                } else if (isEvolved) {
                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size:15px; font-weight: bold; color: #ff4081;">✨ ${currentIcon} ${currentName} (進化済みMAX)</span>
                            <span style="font-size: 13px; color: #ffcc00; font-weight: bold;">MAX</span>
                        </div>
                        ${skillHtml}
                    `;
                } else {
                    let cost = lvl * 100;
                    let canEvolve = (lvl >= 10 && m.hasEvolve);
                    
                    let evolveText = "";
                    if (lvl >= 10 && m.hasEvolve) {
                        evolveText = `<span style="font-size: 11px; color: #00e676; margin-left: 6px;">第2形態あり</span>`;
                    }

                    let rightButtonHtml = "";
                    if (canEvolve) {
                        rightButtonHtml = `<button class="evolve-btn" onclick="evolveUnit(${i})">進化</button>`;
                    } else {
                        rightButtonHtml = `<button class="up-btn" onclick="upgradeUnit(${i})" ${lvl >= 10 ? "disabled style='background:#555;'" : ""}>${lvl >= 10 ? "MAX" : `強化(${cost}XP)`}</button>`;
                    }

                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <span style="font-size:15px; font-weight: bold;">${currentIcon} ${currentName} (Lv:${lvl}/10)</span>
                                ${evolveText}
                            </div>
                            ${rightButtonHtml}
                        </div>
                        ${skillHtml}
                    `;
                }
                list.appendChild(div); 
            }); 
        }

        function unlockUnit(index) {
            if (saveData.xp >= 3000) {
                saveData.xp -= 3000;
                saveData.unlockedUnits[index] = true;
                saveGame();
                openPowerUpScreen();
            } else {
                alert("XPが足りません！（3000XP必要です）");
            }
        }

        function closePowerUpScreen() { 
            document.getElementById("powerUpScreen").classList.remove("active"); 
            document.getElementById("stageSelectScreen").classList.add("active"); 
            initStageSelect(); 
        }

        function upgradeUnit(index) { 
            checkSaveDataIntegrity(); 
            let lvl = saveData.levels[index]; 
            let cost = lvl * 100; 
            if (lvl < 10 && saveData.xp >= cost) { 
                saveData.xp -= cost; 
                saveData.levels[index]++; 
                saveGame(); 
                openPowerUpScreen(); 
            } else if (lvl >= 10) {
                alert("すでに最大レベルです！");
            } else {
                alert("XPが足りません！");
            }
        }

        function evolveUnit(index) {
            let m = monsters[index];
            let req = m.evolveReq;
            
            if (saveData.xp < m.evolveCostXp) {
                alert(`XPが足りません！（${m.evolveCostXp}XP必要です）`);
                return;
            }
            if (req.hp && saveData.materials.hp < req.hp) {
                alert(`体力の心得が足りません！（必要: ${req.hp}個）`);
                return;
            }
            if (req.atk && saveData.materials.atk < req.atk) {
                alert(`攻撃力の心得が足りません！（必要: ${req.atk}個）`);
                return;
            }
            if (req.spd && saveData.materials.spd < req.spd) {
                alert(`速度の心得が足りません！（必要: ${req.spd}個）`);
                return;
            }

            saveData.xp -= m.evolveCostXp;
            if (req.hp) saveData.materials.hp -= req.hp;
            if (req.atk) saveData.materials.atk -= req.atk;
            if (req.spd) saveData.materials.spd -= req.spd;

            saveData.evolved[index] = true;
            saveGame();
            alert(`おめでとう！ ${m.name} が ${m.evolveName} に進化しました！🎉`);
            openPowerUpScreen();
        }

        function initBattleUI() { 
            checkSaveDataIntegrity(); 
            const container = document.getElementById("unitButtons"); 
            container.innerHTML = ""; 
            monsters.forEach((m, i) => { 
                if (!saveData.unlockedUnits[i]) return; 
                let btn = document.createElement("button"); 
                btn.id = "btn-" + i; 
                btn.className = "unit-btn"; 
                updateUnitBtnDisplay(i, btn); 
                btn.onclick = () => spawnMonster(i); 
                container.appendChild(btn); 
            }); 
        }

        function spawnMonster(index) { 
            if (!saveData.unlockedUnits[index]) return;
            if (coolDowns[index] > 0) return; 
            let m = monsters[index]; 
            if (money >= m.cost) { 
                money -= m.cost; 
                coolDowns[index] = m.cd; 
                document.getElementById("money").innerText = money; 
                playSound("spawn"); 

                let lvl = saveData.levels[index] || 1; 
                let multiplier = 1 + (lvl - 1) * 0.15; 
                let hp = m.baseHp * multiplier;
                let atk = m.baseAtk * multiplier;
                let speed = m.speed;

                if (saveData.evolved[index]) {
                    if (index === 0) { hp *= 3; } 
                    else if (index === 1) { hp *= 2; speed *= 1.75; } 
                    else if (index === 2) { atk *= 5; } 
                    else if (index === 3) { hp *= 7.5; } 
                    else if (index === 4) { speed *= 30; } 
                    else if (index === 5) { hp *= 7.5; atk *= 7.5; speed *= 7.5; } 
                }

                activeMonsters.push({ ...m, hp: hp, maxHp: hp, atk: atk, speed: speed, x: 70, evolved: saveData.evolved[index] }); 
            } 
        }

        function spawnEnemy(key) { 
            let template = enemyTemplates[key]; 
            if(template) {
                activeHeroes.push({ ...template, x: 730, hp: template.hp, maxHp: template.hp });
                if (template.isBoss) { playSound("boss"); }
            } 
        }

        function handleStageWaves(sec) {
            switch(currentStage) {
                case 1:
                case 2:
                    if (sec % 5 === 0) spawnEnemy("戦士");
                    if (currentStage === 2 && sec % 8 === 0) spawnEnemy("弓使い");
                    break;
                case 3:
                case 4:
                    if (sec % 5 === 0) spawnEnemy("守護騎士");
                    if (currentStage === 4 && sec % 6 === 0) spawnEnemy("弓使い");
                    break;
                case 5:
                    if (sec === 5) spawnEnemy("フクロウ教授");
                    if (sec % 4 === 0) spawnEnemy("ハト助");
                    break;
                case 6:
                    if (sec % 4 === 0) spawnEnemy("ハト助");
                    if (sec % 5 === 0) spawnEnemy("守護騎士");
                    if (sec % 7 === 0) spawnEnemy("弓使い");
                    break;
                case 7:
                    if (sec % 4 === 0) spawnEnemy("戦士");
                    if (sec % 6 === 0) spawnEnemy("弓使い");
                    if (sec % 8 === 0) spawnEnemy("守護騎士");
                    if (sec % 10 === 0) spawnEnemy("ハト助");
                    if (sec === 20) spawnEnemy("フクロウ教授");
                    
                    if (sec >= 100 && sec % 3 === 0) {
                        spawnEnemy("メェーラム敵");
                    }
                    break;
            }
        }

        setInterval(() => { 
            if (!gameRunning) return; 
            if (money < 9999) { 
                money += 20; 
                document.getElementById("money").innerText = money; 
            } 
        }, 500);

        function drawBackground(ctx, canvas) {
            let img = getBgImageByStage(currentStage);
            if (img && img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                // 背景の上に薄暗いフィルターをかけてキャラクターを見やすくする
                ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#333";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        // キャラクターの後ろに白の丸背景（または文字の縁取り効果）を描画して見やすくする関数
        function drawCharacter(ctx, icon, x, y) {
            ctx.save();
            // 見やすさ向上のための白い丸の背景ベース
            ctx.beginPath();
            ctx.arc(x + 12, y - 12, 22, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#333";
            ctx.stroke();

            // 絵文字本体
            ctx.font = "34px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(icon, x + 12, y - 11);
            ctx.restore();
        }

        function updateGame() {
            if (!gameRunning) return;
            const canvas = document.getElementById("gameCanvas"); 
            const ctx = canvas.getContext("2d"); 
            ctx.clearRect(0, 0, 800, 400);

            // 背景描画（フィルター付き）
            drawBackground(ctx, canvas);

            // 城の表示
            ctx.font = "45px Arial"; 
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
            ctx.fillText("🏰", 15, 335); 
            ctx.fillText("👑", 735, 335);

            // 体力バー
            const bw = 80, bh = 8; 
            ctx.fillStyle = "#555"; ctx.fillRect(15, 260, bw, bh); 
            ctx.fillStyle = "#2ecc71"; ctx.fillRect(15, 260, bw * Math.max(0, playerCastleHP / maxPlayerCastleHP), bh); 
            ctx.fillStyle = "#555"; ctx.fillRect(715, 260, bw, bh); 
            ctx.fillStyle = "#e74c3c"; ctx.fillRect(715, 260, bw * Math.max(0, enemyCastleHP / maxEnemyCastleHP), bh);

            // 味方モンスター描画
            activeMonsters.forEach((m) => {
                let target = activeHeroes.find(h => Math.abs(h.x - m.x) < m.range);
                let currentIcon = m.evolved ? m.evolveIcon : m.icon;
                if (target) {
                    if (m.name === "ボマー") { 
                        effects.push({ x: m.x, y: 330, t: "💥", life: 15 }); 
                        activeHeroes.forEach(h => { if (Math.abs(h.x - m.x) < 120) h.hp -= m.atk; }); 
                        m.hp = 0; 
                    } else if (Math.random() < 0.06) { 
                        projectiles.push({ x: m.x, targetX: target.x, col: "#f1c40f", type: "unit" }); 
                        target.hp -= m.atk; 
                    }
                } else if (m.x < 700) {
                    m.x += m.speed; 
                } else {
                    enemyCastleHP -= 0.6;
                }
                drawCharacter(ctx, currentIcon, m.x, 335);
            });

            let initialEnemyCount = activeHeroes.length;

            // 敵キャラクター描画
            activeHeroes.forEach((h) => {
                if (h.area) {
                    let target = activeMonsters.find(m => Math.abs(m.x - h.x) < h.range);
                    if (target) {
                        effects.push({ x: h.x, y: 330, t: "💥", life: 15 });
                        activeMonsters.forEach(m => {
                            if (Math.abs(m.x - h.x) < 100) {
                                m.hp -= h.atk;
                            }
                        });
                    } else if (h.x > 70) {
                        h.x -= h.speed;
                    } else {
                        playerCastleHP -= 5.0;
                    }
                } else {
                    let target = activeMonsters.find(m => { 
                        if (m.name === "ボマー") return false; 
                        return Math.abs(m.x - h.x) < m.range; 
                    });
                    if (target) { 
                        if (Math.random() < 0.06) { 
                            if (h.isProjectile && target.name === "スズメバチ" && target.skill) {
                                effects.push({ x: target.x, y: 330, t: "🛡️", life: 15 }); 
                            } else if (target.name === "タンクムーン" && h.speed >= 2.0) {
                                let reducedAtk = h.atk * 0.6; 
                                projectiles.push({ x: h.x, targetX: target.x, col: "#e74c3c", type: "enemy" }); 
                                target.hp -= reducedAtk;
                                effects.push({ x: target.x, y: 330, t: "🛡️", life: 10 });
                            } else {
                                projectiles.push({ x: h.x, targetX: target.x, col: "#e74c3c", type: "enemy" }); 
                                target.hp -= h.atk; 
                            }
                        } 
                    } else if (h.x > 70) {
                        h.x -= h.speed; 
                    } else {
                        playerCastleHP -= 0.6;
                    }
                }
                drawCharacter(ctx, h.icon, h.x, 335);
            });

            activeHeroes.forEach(h => {
                if (h.hp <= 0 && h.drop && h.dropRate) {
                    if (Math.random() < h.dropRate) {
                        saveData.materials[h.drop]++;
                        saveGame();
                        let dropName = h.drop === "atk" ? "攻撃力の心得" : h.drop === "hp" ? "体力の心得" : "速度の心得";
                        effects.push({ x: h.x, y: 290, t: `✨${dropName}GET!`, life: 30 });
                    }
                }
            });

            activeMonsters = activeMonsters.filter(m => m.hp > 0);
            activeHeroes = activeHeroes.filter(h => h.hp > 0);
            
            if (activeHeroes.length < initialEnemyCount) {
                playSound("defeat"); 
            }

            projectiles.forEach(p => {
                ctx.fillStyle = p.col;
                ctx.fillRect(p.x, 305, 6, 6);
                p.x += (p.targetX > p.x ? 5 : -5);
            });
            projectiles = projectiles.filter(p => Math.abs(p.x - p.targetX) > 10);

            effects.forEach(e => {
                ctx.font = "20px Arial";
                ctx.fillText(e.t, e.x, e.y - 20);
                e.life--;
            });
            effects = effects.filter(e => e.life > 0);

            if (playerCastleHP <= 0) {
                gameRunning = false;
                alert("敗北しました...");
                returnToMap();
                return;
            }
            if (enemyCastleHP <= 0) {
                gameRunning = false;
                let reward = currentStage * 200;
                saveData.xp += reward;
                if (currentStage === saveData.maxUnlockedStage && saveData.maxUnlockedStage < 7) {
                    saveData.maxUnlockedStage++;
                }
                saveGame();
                alert(`ステージクリア！ ${reward}XPを手に入れた！`);
                returnToMap();
                return;
            }

            gameLoopId = requestAnimationFrame(updateGame);
        }

        function startBattle(stageNum) { 
            currentStage = stageNum; 
            document.getElementById("stageSelectScreen").classList.remove("active"); 
            document.getElementById("battleScreen").classList.add("active"); 
            document.getElementById("stageTitle", stageNum).innerText = `ステージ ${stageNum}`; 
            money = 150; 
            playerCastleHP = 1000; 
            enemyCastleHP = (stageNum === 7) ? 8000 : 6000; 
            maxEnemyCastleHP = enemyCastleHP; 
            activeMonsters = []; 
            activeHeroes = []; 
            projectiles = []; 
            effects = []; 
            gameTimer = 0; 
            coolDowns = [0, 0, 0, 0, 0, 0]; 
            document.getElementById("money").innerText = money; 
            initBattleUI(); 
            gameRunning = true; 
            if(stageTimerInterval) clearInterval(stageTimerInterval); 
            stageTimerInterval = setInterval(() => { 
                if(!gameRunning) return; 
                gameTimer++; 
                handleStageWaves(gameTimer); 
            }, 1000); 
            updateGame(); 
        }

        function returnToMap() { 
            gameRunning = false; 
            cancelAnimationFrame(gameLoopId); 
            if(stageTimerInterval) clearInterval(stageTimerInterval); 
            document.getElementById("battleScreen").classList.remove("active"); 
            document.getElementById("stageSelectScreen").classList.add("active"); 
            initStageSelect(); 
        }

        initStageSelect();
    </script>
</body>
</html>
